# Render Blueprint — GMPI New Product Cascading System
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo -> Apply.
# You will be prompted for ADMIN_USERNAME and ADMIN_PASSWORD (sync: false).
services:
  - type: web
    name: gmpi-cascading
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: gmpi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: gmpi-db
    databaseName: gmpi
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow external connections (required for the one-time data migration)